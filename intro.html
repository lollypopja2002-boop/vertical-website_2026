<!-- HTML5 문서임을 선언합니다. -->
<!doctype html>
<!-- 문서의 기본 언어를 한국어로 지정합니다. -->
<html lang="ko">
  <!-- 페이지 제목, 문자 인코딩, 스타일과 스크립트를 설정합니다. -->
  <head>
    <!-- 한글이 깨지지 않도록 UTF-8 인코딩을 사용합니다. -->
    <meta charset="UTF-8" />
    <!-- 모바일 화면 너비에 맞추고 기본 배율을 1로 설정합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 브라우저 탭에 표시되는 페이지 제목입니다. -->
    <title>세로쓰기 — Intro</title>
    <!-- 스타일 불러오기: 공통 폰트와 글자 스타일. -->
    <link rel="stylesheet" href="css/font.css?v=onulkangsan-all1" />
    <!-- 스타일 불러오기: 공통 페이지 크기와 여백. -->
    <link rel="stylesheet" href="css/common.css?v=responsive20261025" />
    <!-- 스타일 불러오기: 현재 페이지 전용 배치와 시각 효과. -->
    <link rel="stylesheet" href="css/intro.css?v=hover-balance20261025" />
    <!-- 페이지 동작 스크립트 연결; defer가 있으면 HTML 해석 후 실행합니다. -->
    <!-- 현재 화면의 페이드아웃을 처리하는 공통 함수를 먼저 불러옵니다. -->
    <script src="java/page-transition.js" defer></script>
    <script src="java/intro.js" defer></script>
  </head>
  <!-- 화면에 실제로 표시되는 콘텐츠입니다. -->
  <body>
    <!-- 페이지의 주 콘텐츠; page 클래스는 공통 크기와 여백을 적용합니다. -->
    <main class="page page--intro" aria-label="세로쓰기 소개">
      <!-- 공통 패딩 안에 들어가는 콘텐츠 영역입니다. -->
      <div class="page__content">
        <!-- 인트로 그래픽; alt는 대체 설명, tabindex="0"은 키보드 포커스를 허용합니다. -->
        <img class="intro__graphic" src="img/intro_1.svg" width="432" height="488" alt="다음 페이지로 이동" tabindex="0" />
        <!-- 장식용 모서리 이미지; 빈 alt는 보조 기기에서 설명을 생략합니다. -->
        <img class="intro__bolt intro__bolt--top-left" src="img/bolt%20graphic.svg" width="44" height="44" alt="" />
        <!-- 장식용 모서리 이미지; 빈 alt는 보조 기기에서 설명을 생략합니다. -->
        <img class="intro__bolt intro__bolt--top-right" src="img/bolt%20graphic.svg" width="44" height="44" alt="" />
        <!-- 장식용 모서리 이미지; 빈 alt는 보조 기기에서 설명을 생략합니다. -->
        <img class="intro__bolt intro__bolt--bottom-left" src="img/bolt%20graphic.svg" width="44" height="44" alt="" />
        <!-- 장식용 모서리 이미지; 빈 alt는 보조 기기에서 설명을 생략합니다. -->
        <img class="intro__bolt intro__bolt--bottom-right" src="img/bolt%20graphic.svg" width="44" height="44" alt="" />
      </div>
    </main>
  </body>
</html>
