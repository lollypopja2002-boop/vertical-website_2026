<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 — 세로형 네이버</title><link rel="stylesheet" href="../css/font.css?v=onulkangsan-all1"><link rel="stylesheet" href="../css/common.css?v=responsive20261025"><link rel="stylesheet" href="../css/naver-login.css?v=responsive20261025"><script src="../java/naver-login.js" defer></script></head>
<body class="naver-site"><main class="page page--naver-login"><div class="page__content login-layout">
<a class="login-logo" href="../07.html" aria-label="세로형 네이버 홈"><img src="../img/naver-logo.svg" alt="NAVER" width="342" height="1220"></a>
<form class="login-card" id="login-form">
<div class="login-fields">
<label class="login-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="5"/><path d="M3 23v-2c0-9 18-9 18 0v2"/></svg><input id="login-id" name="id" type="text" placeholder="아이디 또는 전화번호" aria-label="아이디 또는 전화번호" autocomplete="off" spellcheck="false" required><span class="field-error" id="id-error"></span></label>
<label class="login-field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18v13H3z M7 10V6a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg><input id="login-password" name="password" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="off" required><button type="button" class="password-visibility" aria-label="비밀번호 표시" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="visibility-slash" d="m3 3 18 18"/></svg></button></label>
</div>
<div class="login-options"><label class="login-remember"><input type="checkbox" id="login-remember"><span class="remember-check" aria-hidden="true">✓</span><span>로그인<br>상태유지</span></label><label class="login-ip"><span>IP<br>보안</span><input type="checkbox" role="switch" aria-label="IP 보안 옵션"><span class="ip-switch" aria-hidden="true"></span></label></div>
<div class="login-primary"><button type="button" class="login-passkey" data-login-dialog="passkey"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="7" r="5"/><path d="M2 23v-4c0-9 16-9 16 0v4 M20 9v10M16 13h8"/></svg><span>패스키</span></button><button type="submit" class="login-submit"><span>로그인</span></button></div>
<div class="login-alternatives"><button type="button" data-login-dialog="qr"><svg viewBox="1.25 1.25 21.5 21.5" aria-hidden="true"><path d="M2 2h7v7H2z M15 2h7v7h-7z M2 15h7v7H2z M15 15h3v3h-3z M21 15v7h-6 M18 19h3"/></svg><span>QR코드<br>로그인</span></button><button type="button" data-login-dialog="otp"><svg viewBox="3 3 18 18" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></g></svg><span>일회용번호<br>로그인</span></button></div>
<p class="login-feedback" id="login-feedback" role="status" aria-live="polite"></p>
</form>
<nav class="login-help" aria-label="계정 도움말"><a href="find-id.html">아이디<br>찾기</a><a href="find-password.html">비밀번호<br>찾기</a><a href="signup.html">회원가입</a></nav>

<footer class="login-footer"><nav><a href="detail.html?item=help">상담<br>스마트봇</a><a href="detail.html?item=help">고객센터</a><label class="login-language"><span>언어</span><select aria-label="언어"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></label></nav><small>©<br>NAVER<br>Corp。</small></footer>
</div></main>
<dialog id="login-dialog"><div class="login-dialog-content"><button type="button" id="login-dialog-close" aria-label="닫기">×</button><h2 id="login-dialog-title"></h2><p id="login-dialog-description"></p><form id="otp-form" hidden><label>일회용 번호<input aria-label="일회용 번호" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="8자리 번호" required></label><button type="submit">확인</button></form><a href="../07.html">네이버 홈으로</a></div></dialog>
</body></html>
